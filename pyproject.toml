[project]
name = "contract-drafting"
version = "0.1.0"
description = "AI Contract Drafting Platform — Deep Agent"
requires-python = ">=3.10,<3.13"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    # Pinned exactly, not ranged. openai-agents declares `openai<3,>=2.36` but openai 2.45.0
    # made `InputTokensDetails.cache_write_tokens` required, which broke `agents.usage.Usage()`
    # on openai-agents 0.18.0 — a combination the declared constraint permits. 0.18.1 fixes it.
    # tests/test_sdk_compat.py is the canary; bump these together and let CI prove the pair.
    "openai==2.45.0",
    "openai-agents==0.18.1",
    "jinja2>=3.1.4",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.18",
    "python-frontmatter>=1.1.0",
    # Playbook rules and the clause taxonomy are YAML. Available transitively via
    # python-frontmatter, but declared because we import it directly.
    "pyyaml>=6.0",
    "sse-starlette>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

# The SDK's import root is `agents`. We must never shadow it, so pytest's rootdir
# stays at the repo root and `backend/` never lands on sys.path.
# See tests/test_import_guard.py.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "requires_api_key: hits a real model; excluded from the default CI run",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# `Depends(...)` in an argument default is the FastAPI idiom, not a mutable-default bug.
"backend/api/routers/*" = ["B008"]
# alembic/env.py must configure sys.path and settings before importing models.
"alembic/env.py" = ["E402", "I001"]
# Generated by `alembic revision --autogenerate`; its template uses typing.Union/Sequence.
"alembic/versions/*" = ["E501", "I001", "UP007", "UP035"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["frontmatter.*", "docx.*", "pypdf.*", "yaml.*"]
ignore_missing_imports = true
